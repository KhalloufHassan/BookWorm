# Tests the server and publishes its Docker image to GitHub's container registry on every push to main:
#   ghcr.io/khalloufhassan/bookworm:latest  (and :sha-<commit>, to go back to an earlier version)
#
# Servers running the image with Watchtower pick up the new version by themselves (see "Automatic
# updates" in the README).
name: Server image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The server's tests start PostgreSQL in Docker (Testcontainers).
      - name: Server tests
        run: dotnet test --project tests/BookWorm.Server.Tests/BookWorm.Server.Tests.csproj

      - name: Mobile core tests
        run: dotnet test --project tests/BookWorm.Mobile.Core.Tests/BookWorm.Mobile.Core.Tests.csproj

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/khalloufhassan/bookworm
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
